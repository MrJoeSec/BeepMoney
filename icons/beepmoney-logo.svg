<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0E1726" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Vibrant Mint-to-Cyan Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <!-- Outer Rim Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Ambient Central Halo -->
  <circle cx="256" cy="256" r="140" fill="#06B6D4" opacity="0.08" filter="url(#glow)" />

  <!-- Radar / Soundwave Frequency Rings (The "Beep") -->
  <!-- Left Soundwaves -->
  <path d="M 125 180 A 110 110 0 0 0 125 332" fill="none" stroke="url(#primaryGrad)" stroke-width="10" stroke-linecap="round" opacity="0.4" />
  <path d="M 95 205 A 75 75 0 0 0 95 307" fill="none" stroke="url(#primaryGrad)" stroke-width="8" stroke-linecap="round" opacity="0.25" />
  <circle cx="70" cy="256" r="6" fill="#10B981" opacity="0.6" filter="url(#softGlow)" />

  <!-- Right Soundwaves -->
  <path d="M 387 180 A 110 110 0 0 1 387 332" fill="none" stroke="url(#primaryGrad)" stroke-width="10" stroke-linecap="round" opacity="0.4" />
  <path d="M 417 205 A 75 75 0 0 1 417 307" fill="none" stroke="url(#primaryGrad)" stroke-width="8" stroke-linecap="round" opacity="0.25" />
  <circle cx="442" cy="256" r="6" fill="#06B6D4" opacity="0.6" filter="url(#softGlow)" />

  <!-- Central Circular Tech Ring -->
  <circle cx="256" cy="256" r="132" fill="#0D1524" stroke="url(#primaryGrad)" stroke-width="7" />
  <circle cx="256" cy="256" r="118" fill="none" stroke="#22D3EE" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="8 6" />

  <!-- Glowing Digital Pulse Nodes -->
  <circle cx="256" cy="124" r="7" fill="#34D399" filter="url(#softGlow)" />
  <circle cx="256" cy="388" r="7" fill="#22D3EE" filter="url(#softGlow)" />

  <!-- Modern Geometric "B" + "$" Monogram -->
  <!-- Vertical Dollar Spine -->
  <line x1="242" y1="145" x2="242" y2="367" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" opacity="0.9" />

  <!-- Main "B" Shape -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Back Spine of B -->
    <line x1="206" y1="172" x2="206" y2="340" stroke-width="24" />

    <!-- Top Loop of B -->
    <path d="M 206 172 H 268 C 298 172 316 190 316 216 C 316 242 298 256 268 256 H 206" stroke-width="24" />

    <!-- Bottom Loop of B (Slightly larger) -->
    <path d="M 206 256 H 276 C 308 256 328 274 328 300 C 328 326 308 340 276 340 H 206" stroke-width="24" />
  </g>

  <!-- Sound Pulse Beam Across Center Bar of B -->
  <rect x="222" y="248" width="60" height="16" rx="8" fill="url(#primaryGrad)" filter="url(#softGlow)" />

  <!-- Internal Digital Beep Dots -->
  <circle cx="254" cy="214" r="8" fill="#10B981" />
  <circle cx="260" cy="298" r="8" fill="#06B6D4" />
</svg>
